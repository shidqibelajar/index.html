<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Keuangan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;background:#f5f5f0;color:#1a1a18;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid #e0dfd8;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:50}
.topbar-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.topbar-title svg{width:20px;height:20px;color:#5f5e5a}
.nav{display:flex;gap:0;overflow-x:auto}
.nav button{padding:8px 14px;border:none;background:none;cursor:pointer;font-size:13px;color:#888780;border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit;display:flex;align-items:center;gap:6px;transition:color 0.15s}
.nav button.active{color:#1a1a18;border-bottom-color:#1a1a18;font-weight:500}
.nav button:hover:not(.active){color:#1a1a18;background:#f5f5f0}
.content{max-width:960px;margin:0 auto;padding:1.5rem 1.5rem}
.tab{display:none}.tab.active{display:block}
.card{background:#fff;border:1px solid #e0dfd8;border-radius:10px;padding:1.25rem;margin-bottom:1rem}
.card-title{font-size:14px;font-weight:500;margin-bottom:1rem;display:flex;align-items:center;gap:8px;color:#1a1a18}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1rem}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:12px;color:#888780;font-weight:500;text-transform:uppercase;letter-spacing:0.04em}
.form-group input,.form-group select,.form-group textarea{padding:9px 11px;border:1px solid #d3d1c7;border-radius:8px;background:#fff;color:#1a1a18;font-size:13px;font-family:inherit;outline:none;transition:border-color 0.15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#888780;box-shadow:0 0 0 3px rgba(136,135,128,0.1)}
.form-group textarea{resize:vertical;min-height:64px}
.btn{padding:8px 16px;border:1px solid #d3d1c7;border-radius:8px;background:#fff;color:#1a1a18;cursor:pointer;font-size:13px;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all 0.15s}
.btn:hover{background:#f5f5f0;border-color:#888780}
.btn:active{transform:scale(0.98)}
.btn-primary{background:#1a1a18;color:#fff;border-color:#1a1a18}
.btn-primary:hover{background:#2c2c2a;border-color:#2c2c2a}
.btn-danger{color:#a32d2d;border-color:#f7c1c1}
.btn-danger:hover{background:#fcebeb}
.btn-sm{padding:4px 10px;font-size:12px}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:1.5rem}
.metric{background:#fff;border:1px solid #e0dfd8;border-radius:10px;padding:1rem 1.25rem}
.metric .lbl{font-size:11px;color:#888780;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px}
.metric .val{font-size:18px;font-weight:600;line-height:1.2}
.metric .val.pos{color:#3b6d11}
.metric .val.neg{color:#a32d2d}
.metric .val.neu{color:#1a1a18}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;font-weight:500;font-size:11px;color:#888780;border-bottom:1px solid #e0dfd8;text-transform:uppercase;letter-spacing:0.04em;background:#fafaf7}
td{padding:9px 10px;border-bottom:1px solid #f1efe8;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafaf7}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-in{background:#eaf3de;color:#3b6d11}
.badge-out{background:#fcebeb;color:#a32d2d}
.badge-aset{background:#e6f1fb;color:#185fa5}
.badge-liab{background:#faeeda;color:#854f0b}
.badge-modal{background:#eeedfe;color:#534ab7}
.empty{text-align:center;padding:3rem 1rem;color:#b4b2a9;font-size:13px}
.section-box{background:#fff;border:1px solid #e0dfd8;border-radius:10px;padding:1.25rem;margin-bottom:1rem}
.section-box-title{font-size:13px;font-weight:500;margin-bottom:0.75rem;display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid #f1efe8}
.section-total{background:#f5f5f0;border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:0.75rem;font-weight:600;font-size:14px}
.alert{padding:10px 16px;border-radius:8px;font-size:13px;margin-bottom:1rem;display:none;font-weight:500}
.alert-ok{background:#eaf3de;color:#3b6d11}
.alert-err{background:#fcebeb;color:#a32d2d}
.filter-bar{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.filter-bar select{padding:7px 10px;border:1px solid #d3d1c7;border-radius:8px;background:#fff;color:#1a1a18;font-size:13px;font-family:inherit;outline:none}
.mono{font-family:'Courier New',monospace;font-size:12px}
.laba-result{border-radius:10px;padding:1.25rem 1.5rem;display:flex;justify-content:space-between;align-items:center;margin-top:0.5rem}
.laba-result.pos{background:#eaf3de}
.laba-result.neg{background:#fcebeb}
.laba-result .lbl{font-weight:600;font-size:15px}
.laba-result .val{font-weight:700;font-size:22px}
.laba-result.pos .val{color:#3b6d11}
.laba-result.neg .val{color:#a32d2d}
.neraca-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.balance-check{border-radius:8px;padding:10px 14px;font-size:12px;display:flex;align-items:center;gap:6px;margin-top:0.5rem}
.balance-ok{background:#eaf3de;color:#3b6d11}
.balance-warn{background:#faeeda;color:#854f0b}
.page-title{font-size:13px;font-weight:500;color:#888780;text-align:center;margin-bottom:1.5rem}
.kpi-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:0.5rem;font-size:12px;color:#888780}
.kpi-chip{background:#f5f5f0;border-radius:6px;padding:4px 10px}
.divider{border:none;border-top:1px solid #e0dfd8;margin:1rem 0}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}.neraca-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M8 12h8M8 16h5M8 8h8"/></svg>
    Dashboard Keuangan
  </div>
  <div class="nav" id="main-nav">
    <button class="active" onclick="showTab('input',this)">＋ Input Transaksi</button>
    <button onclick="showTab('jurnal',this)">≡ Jurnal Umum</button>
    <button onclick="showTab('labarugi',this)">↑↓ Laba Rugi</button>
    <button onclick="showTab('buku',this)">📒 Buku Besar</button>
    <button onclick="showTab('neraca',this)">⚖ Neraca</button>
  </div>
</div>

<div class="content">
  <div id="alert-box" class="alert"></div>

  <!-- INPUT -->
  <div id="tab-input" class="tab active">
    <div class="card">
      <div class="card-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Catat Transaksi Baru
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label>Tanggal</label>
          <input type="date" id="inp-tanggal">
        </div>
        <div class="form-group">
          <label>Jenis Transaksi</label>
          <select id="inp-jenis" onchange="onJenisChange()">
            <option value="pendapatan">Pendapatan (Pemasukan)</option>
            <option value="pengeluaran">Pengeluaran (Beban)</option>
            <option value="aset">Penambahan Aset</option>
            <option value="liabilitas">Utang / Kewajiban</option>
            <option value="modal">Modal / Investasi</option>
          </select>
        </div>
        <div class="form-group">
          <label>Akun</label>
          <select id="inp-akun"></select>
        </div>
        <div class="form-group">
          <label>Nominal (Rp)</label>
          <input type="number" id="inp-nominal" placeholder="0" min="0" step="100">
        </div>
        <div class="form-group" style="grid-column:1/-1">
          <label>Sumber / Tujuan Dana</label>
          <input type="text" id="inp-sumber" placeholder="contoh: Pelanggan A, Toko Bahan ABC, Freelance Project XYZ...">
        </div>
        <div class="form-group" style="grid-column:1/-1">
          <label>Keterangan / Deskripsi</label>
          <textarea id="inp-keterangan" placeholder="Deskripsi singkat transaksi ini..."></textarea>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" onclick="tambahTransaksi()">✓ Simpan Transaksi</button>
        <button class="btn" onclick="resetForm()">↺ Reset</button>
      </div>
    </div>

    <div class="metric-grid" id="summary-metrics"></div>

    <div class="card">
      <div class="card-title">Transaksi Terakhir (5)</div>
      <div id="recent-list"></div>
    </div>
  </div>

  <!-- JURNAL -->
  <div id="tab-jurnal" class="tab">
    <div class="filter-bar">
      <select id="filter-bulan" onchange="renderJurnal()">
        <option value="">Semua Bulan</option>
      </select>
      <select id="filter-jenis" onchange="renderJurnal()">
        <option value="">Semua Jenis</option>
        <option value="pendapatan">Pendapatan</option>
        <option value="pengeluaran">Pengeluaran</option>
        <option value="aset">Aset</option>
        <option value="liabilitas">Liabilitas</option>
        <option value="modal">Modal</option>
      </select>
      <button class="btn btn-danger" onclick="if(confirm('Hapus SEMUA data? Tindakan ini tidak bisa dibatalkan!'))clearAll()">🗑 Hapus Semua Data</button>
    </div>
    <div class="card" style="overflow-x:auto">
      <div id="jurnal-table"></div>
    </div>
  </div>

  <!-- LABA RUGI -->
  <div id="tab-labarugi" class="tab">
    <div class="filter-bar">
      <select id="lr-bulan" onchange="renderLabaRugi()">
        <option value="">Semua Periode</option>
      </select>
    </div>
    <div id="lr-content"></div>
  </div>

  <!-- BUKU BESAR -->
  <div id="tab-buku" class="tab">
    <div class="filter-bar">
      <select id="bb-akun" onchange="renderBukuBesar()">
        <option value="">Semua Akun</option>
      </select>
    </div>
    <div id="bb-content"></div>
  </div>

  <!-- NERACA -->
  <div id="tab-neraca" class="tab">
    <div class="filter-bar">
      <select id="neraca-bulan" onchange="renderNeraca()">
        <option value="">Semua Periode</option>
      </select>
    </div>
    <div id="neraca-content"></div>
  </div>
</div>

<script>
const AKUN_MAP = {
  pendapatan: ['Penjualan Produk','Pendapatan Jasa','Pendapatan Freelance','Pendapatan Sewa','Pendapatan Bunga','Pendapatan Lain-lain'],
  pengeluaran: ['Beban Gaji','Beban Sewa Tempat','Beban Listrik & Air','Beban Bahan Baku','Beban Pemasaran','Beban Transportasi','Beban Administrasi','Beban Penyusutan','Beban Pajak','Beban Lain-lain'],
  aset: ['Kas & Bank','Piutang Usaha','Persediaan Barang','Peralatan','Kendaraan','Tanah & Bangunan','Aset Lain-lain'],
  liabilitas: ['Utang Usaha','Utang Bank','Utang Pajak','Kewajiban Jangka Panjang','Kewajiban Lain-lain'],
  modal: ['Modal Disetor','Investasi Tambahan','Laba Ditahan']
};
const KODE_AKUN = {
  'Penjualan Produk':'4-001','Pendapatan Jasa':'4-002','Pendapatan Freelance':'4-003','Pendapatan Sewa':'4-004','Pendapatan Bunga':'4-005','Pendapatan Lain-lain':'4-006',
  'Beban Gaji':'5-001','Beban Sewa Tempat':'5-002','Beban Listrik & Air':'5-003','Beban Bahan Baku':'5-004','Beban Pemasaran':'5-005','Beban Transportasi':'5-006','Beban Administrasi':'5-007','Beban Penyusutan':'5-008','Beban Pajak':'5-009','Beban Lain-lain':'5-010',
  'Kas & Bank':'1-001','Piutang Usaha':'1-002','Persediaan Barang':'1-003','Peralatan':'1-004','Kendaraan':'1-005','Tanah & Bangunan':'1-006','Aset Lain-lain':'1-007',
  'Utang Usaha':'2-001','Utang Bank':'2-002','Utang Pajak':'2-003','Kewajiban Jangka Panjang':'2-004','Kewajiban Lain-lain':'2-005',
  'Modal Disetor':'3-001','Investasi Tambahan':'3-002','Laba Ditahan':'3-003'
};

let data = [];
const STORAGE_KEY = 'dashboard_keuangan_v2';

function loadData() {
  try { const s = localStorage.getItem(STORAGE_KEY); if(s) data = JSON.parse(s); } catch(e) { data = []; }
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
}
function fmt(n) {
  return 'Rp ' + Math.round(Math.abs(n)).toLocaleString('id-ID');
}
function showAlert(msg, type='ok') {
  const el = document.getElementById('alert-box');
  el.className = 'alert alert-' + type;
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 3000);
}
function onJenisChange() {
  const j = document.getElementById('inp-jenis').value;
  const sel = document.getElementById('inp-akun');
  sel.innerHTML = AKUN_MAP[j].map(a => `<option value="${a}">${a}</option>`).join('');
}
function showTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if(btn) btn.classList.add('active');
  if(name==='jurnal') renderJurnal();
  if(name==='labarugi') renderLabaRugi();
  if(name==='buku') renderBukuBesar();
  if(name==='neraca') renderNeraca();
}
function tambahTransaksi() {
  const tgl = document.getElementById('inp-tanggal').value;
  const jenis = document.getElementById('inp-jenis').value;
  const akun = document.getElementById('inp-akun').value;
  const nominal = parseFloat(document.getElementById('inp-nominal').value);
  const sumber = document.getElementById('inp-sumber').value.trim();
  const ket = document.getElementById('inp-keterangan').value.trim();
  if(!tgl) { showAlert('Tanggal wajib diisi!', 'err'); return; }
  if(!nominal || nominal <= 0) { showAlert('Nominal harus lebih dari 0!', 'err'); return; }
  data.push({ id: Date.now(), tanggal: tgl, jenis, akun, nominal, sumber, keterangan: ket });
  saveData();
  renderSummary(); renderRecent(); populateFilters();
  showAlert('Transaksi berhasil disimpan.');
  document.getElementById('inp-nominal').value = '';
  document.getElementById('inp-sumber').value = '';
  document.getElementById('inp-keterangan').value = '';
}
function resetForm() {
  document.getElementById('inp-nominal').value = '';
  document.getElementById('inp-sumber').value = '';
  document.getElementById('inp-keterangan').value = '';
}
function hapus(id) {
  if(!confirm('Hapus transaksi ini?')) return;
  data = data.filter(d => d.id !== id);
  saveData();
  renderSummary(); renderRecent(); renderJurnal(); populateFilters();
}
function clearAll() {
  data = [];
  saveData();
  renderSummary(); renderRecent(); renderJurnal(); renderBukuBesar(); renderLabaRugi(); renderNeraca(); populateFilters();
  showAlert('Semua data telah dihapus.');
}
function renderSummary() {
  const totPend = data.filter(d => d.jenis === 'pendapatan').reduce((s, d) => s + d.nominal, 0);
  const totPeng = data.filter(d => d.jenis === 'pengeluaran').reduce((s, d) => s + d.nominal, 0);
  const laba = totPend - totPeng;
  const totAset = data.filter(d => d.jenis === 'aset').reduce((s, d) => s + d.nominal, 0);
  const kas = data.filter(d => d.akun === 'Kas & Bank').reduce((s, d) => s + d.nominal, 0);
  document.getElementById('summary-metrics').innerHTML = `
    <div class="metric"><div class="lbl">Total Pendapatan</div><div class="val pos">${fmt(totPend)}</div></div>
    <div class="metric"><div class="lbl">Total Pengeluaran</div><div class="val neg">${fmt(totPeng)}</div></div>
    <div class="metric"><div class="lbl">Laba / Rugi Bersih</div><div class="val ${laba>=0?'pos':'neg'}">${laba<0?'- ':''}${fmt(laba)}</div></div>
    <div class="metric"><div class="lbl">Total Aset Tercatat</div><div class="val neu">${fmt(totAset)}</div></div>
    <div class="metric"><div class="lbl">Kas & Bank</div><div class="val neu">${fmt(kas)}</div></div>
  `;
}
function renderRecent() {
  const rec = [...data].sort((a, b) => b.id - a.id).slice(0, 5);
  const el = document.getElementById('recent-list');
  if(!rec.length) { el.innerHTML = '<div class="empty">Belum ada transaksi. Mulai catat di atas.</div>'; return; }
  const badgeClass = j => ({pendapatan:'badge-in',pengeluaran:'badge-out',aset:'badge-aset',liabilitas:'badge-liab',modal:'badge-modal'}[j]||'badge-out');
  el.innerHTML = `<table><thead><tr><th>Tanggal</th><th>Akun</th><th>Sumber/Tujuan</th><th>Jenis</th><th style="text-align:right">Nominal</th></tr></thead><tbody>
  ${rec.map(d=>`<tr>
    <td>${d.tanggal}</td>
    <td>${d.akun}</td>
    <td style="color:#888780">${d.sumber||'-'}</td>
    <td><span class="badge ${badgeClass(d.jenis)}">${d.jenis}</span></td>
    <td style="text-align:right;font-weight:600">${fmt(d.nominal)}</td>
  </tr>`).join('')}
  </tbody></table>`;
}
function getMonths() {
  const set = new Set(data.map(d => d.tanggal.slice(0, 7)));
  return [...set].sort().reverse();
}
function populateFilters() {
  const months = getMonths();
  const opts = '<option value="">Semua</option>' + months.map(m => {
    const [y, mo] = m.split('-');
    const bln = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][parseInt(mo)-1];
    return `<option value="${m}">${bln} ${y}</option>`;
  }).join('');
  ['filter-bulan','lr-bulan','neraca-bulan'].forEach(id => {
    const el = document.getElementById(id); if(el) el.innerHTML = opts;
  });
  const akunSet = new Set(data.map(d => d.akun));
  const bbAkun = document.getElementById('bb-akun');
  if(bbAkun) bbAkun.innerHTML = '<option value="">Semua Akun</option>' + [...akunSet].sort().map(a=>`<option value="${a}">${a} (${KODE_AKUN[a]||'?'})</option>`).join('');
}
function filterByMonth(arr, bulan) {
  if(!bulan) return arr;
  return arr.filter(d => d.tanggal.startsWith(bulan));
}
function renderJurnal() {
  const bulan = document.getElementById('filter-bulan').value;
  const jenis = document.getElementById('filter-jenis').value;
  let arr = filterByMonth(data, bulan);
  if(jenis) arr = arr.filter(d => d.jenis === jenis);
  arr = [...arr].sort((a, b) => a.tanggal.localeCompare(b.tanggal) || a.id - b.id);
  const el = document.getElementById('jurnal-table');
  if(!arr.length) { el.innerHTML = '<div class="empty">Tidak ada transaksi pada filter ini.</div>'; return; }
  const badgeClass = j => ({pendapatan:'badge-in',pengeluaran:'badge-out',aset:'badge-aset',liabilitas:'badge-liab',modal:'badge-modal'}[j]||'badge-out');
  el.innerHTML = `<table><thead><tr><th>#</th><th>Tanggal</th><th>Kode</th><th>Akun</th><th>Sumber / Tujuan</th><th>Keterangan</th><th>Jenis</th><th style="text-align:right">Debit</th><th style="text-align:right">Kredit</th><th></th></tr></thead><tbody>
  ${arr.map((d, i) => {
    const isDebit = ['aset','pengeluaran'].includes(d.jenis);
    return `<tr>
      <td style="color:#b4b2a9">${i+1}</td>
      <td>${d.tanggal}</td>
      <td class="mono" style="color:#b4b2a9">${KODE_AKUN[d.akun]||'-'}</td>
      <td style="font-weight:500">${d.akun}</td>
      <td style="color:#888780">${d.sumber||'-'}</td>
      <td style="color:#888780">${d.keterangan||'-'}</td>
      <td><span class="badge ${badgeClass(d.jenis)}">${d.jenis}</span></td>
      <td style="text-align:right;color:#185fa5">${isDebit ? fmt(d.nominal) : '-'}</td>
      <td style="text-align:right;color:#3b6d11">${!isDebit ? fmt(d.nominal) : '-'}</td>
      <td><button class="btn btn-danger btn-sm" onclick="hapus(${d.id})" title="Hapus">✕</button></td>
    </tr>`;
  }).join('')}
  </tbody></table>`;
}
function renderLabaRugi() {
  const bulan = document.getElementById('lr-bulan').value;
  const arr = filterByMonth(data, bulan);
  const pend = arr.filter(d => d.jenis === 'pendapatan');
  const peng = arr.filter(d => d.jenis === 'pengeluaran');
  const totPend = pend.reduce((s, d) => s + d.nominal, 0);
  const totPeng = peng.reduce((s, d) => s + d.nominal, 0);
  const laba = totPend - totPeng;
  const byAkun = a => {
    const m = {};
    a.forEach(d => { m[d.akun] = (m[d.akun]||0) + d.nominal; });
    return Object.entries(m).sort((a,b) => b[1]-a[1]);
  };
  const pendRows = byAkun(pend);
  const pengRows = byAkun(peng);
  const margin = totPend > 0 ? ((laba/totPend)*100).toFixed(1) : 'N/A';
  const rasioBeban = totPend > 0 ? ((totPeng/totPend)*100).toFixed(1) : 'N/A';
  const el = document.getElementById('lr-content');
  el.innerHTML = `
  <div class="page-title">Laporan Laba Rugi &nbsp;|&nbsp; ${bulan||'Semua Periode'}</div>
  <div class="section-box">
    <div class="section-box-title" style="color:#3b6d11">▲ Pendapatan</div>
    ${pendRows.length ? `<table><thead><tr><th>Kode</th><th>Akun</th><th>Jumlah Transaksi</th><th style="text-align:right">Total</th><th style="text-align:right">%</th></tr></thead><tbody>
    ${pendRows.map(([a,v]) => {
      const cnt = pend.filter(d=>d.akun===a).length;
      return `<tr><td class="mono" style="color:#b4b2a9">${KODE_AKUN[a]||'-'}</td><td>${a}</td><td style="color:#888780">${cnt} transaksi</td><td style="text-align:right;font-weight:500">${fmt(v)}</td><td style="text-align:right;color:#888780">${totPend>0?((v/totPend)*100).toFixed(1):0}%</td></tr>`;
    }).join('')}
    </tbody></table>` : '<div class="empty" style="padding:1rem">Belum ada pendapatan di periode ini</div>'}
    <div class="section-total"><span>Total Pendapatan</span><span style="color:#3b6d11">${fmt(totPend)}</span></div>
  </div>
  <div class="section-box">
    <div class="section-box-title" style="color:#a32d2d">▼ Beban & Pengeluaran</div>
    ${pengRows.length ? `<table><thead><tr><th>Kode</th><th>Akun</th><th>Jumlah Transaksi</th><th style="text-align:right">Total</th><th style="text-align:right">%</th></tr></thead><tbody>
    ${pengRows.map(([a,v]) => {
      const cnt = peng.filter(d=>d.akun===a).length;
      return `<tr><td class="mono" style="color:#b4b2a9">${KODE_AKUN[a]||'-'}</td><td>${a}</td><td style="color:#888780">${cnt} transaksi</td><td style="text-align:right;font-weight:500">${fmt(v)}</td><td style="text-align:right;color:#888780">${totPeng>0?((v/totPeng)*100).toFixed(1):0}%</td></tr>`;
    }).join('')}
    </tbody></table>` : '<div class="empty" style="padding:1rem">Belum ada pengeluaran di periode ini</div>'}
    <div class="section-total"><span>Total Beban</span><span style="color:#a32d2d">${fmt(totPeng)}</span></div>
  </div>
  <div class="laba-result ${laba>=0?'pos':'neg'}">
    <div class="lbl">${laba>=0?'✓ Laba Bersih':'✗ Rugi Bersih'}</div>
    <div class="val">${laba<0?'- ':''}${fmt(laba)}</div>
  </div>
  <div style="display:flex;gap:8px;margin-top:0.75rem;flex-wrap:wrap">
    <div class="kpi-chip">Margin Laba: <strong>${margin}%</strong></div>
    <div class="kpi-chip">Rasio Beban: <strong>${rasioBeban}%</strong></div>
    <div class="kpi-chip">Total Transaksi: <strong>${arr.length}</strong></div>
  </div>`;
}
function renderBukuBesar() {
  const akunFilter = document.getElementById('bb-akun').value;
  let akunSet = new Set(data.map(d => d.akun));
  if(akunFilter) akunSet = new Set([akunFilter]);
  const el = document.getElementById('bb-content');
  if(!akunSet.size) { el.innerHTML = '<div class="section-box"><div class="empty">Belum ada data transaksi.</div></div>'; return; }
  let html = '';
  [...akunSet].sort().forEach(akun => {
    const txs = [...data].filter(d => d.akun === akun).sort((a,b) => a.tanggal.localeCompare(b.tanggal) || a.id - b.id);
    let saldo = 0;
    const jenis0 = txs[0]?.jenis;
    html += `<div class="section-box">
    <div class="section-box-title">
      📒 ${akun} <span class="mono" style="color:#b4b2a9;margin-left:4px">${KODE_AKUN[akun]||''}</span>
    </div>
    <table><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Sumber/Tujuan</th><th style="text-align:right">Debit</th><th style="text-align:right">Kredit</th><th style="text-align:right">Saldo</th></tr></thead><tbody>`;
    txs.forEach(d => {
      const isDebit = ['aset','pengeluaran'].includes(d.jenis);
      if(isDebit) saldo += d.nominal; else saldo -= d.nominal;
      html += `<tr>
        <td>${d.tanggal}</td>
        <td>${d.keterangan||'-'}</td>
        <td style="color:#888780">${d.sumber||'-'}</td>
        <td style="text-align:right;color:#185fa5">${isDebit?fmt(d.nominal):'-'}</td>
        <td style="text-align:right;color:#3b6d11">${!isDebit?fmt(d.nominal):'-'}</td>
        <td style="text-align:right;font-weight:600;color:${saldo>=0?'#3b6d11':'#a32d2d'}">${saldo<0?'- ':''}${fmt(saldo)}</td>
      </tr>`;
    });
    html += `<tr style="background:#fafaf7;font-weight:600"><td colspan="3" style="border-top:2px solid #e0dfd8;padding-top:10px">Saldo Akhir</td>
    <td colspan="3" style="text-align:right;border-top:2px solid #e0dfd8;padding-top:10px;font-size:15px;color:${saldo>=0?'#3b6d11':'#a32d2d'}">${saldo<0?'- ':''}${fmt(saldo)}</td></tr>`;
    html += `</tbody></table></div>`;
  });
  el.innerHTML = html;
}
function renderNeraca() {
  const bulan = document.getElementById('neraca-bulan').value;
  const arr = filterByMonth(data, bulan);
  const totAset = arr.filter(d => d.jenis==='aset').reduce((s,d) => s+d.nominal, 0);
  const totLiab = arr.filter(d => d.jenis==='liabilitas').reduce((s,d) => s+d.nominal, 0);
  const totModal = arr.filter(d => d.jenis==='modal').reduce((s,d) => s+d.nominal, 0);
  const labaNet = arr.filter(d=>d.jenis==='pendapatan').reduce((s,d)=>s+d.nominal,0) - arr.filter(d=>d.jenis==='pengeluaran').reduce((s,d)=>s+d.nominal,0);
  const totEkuitas = totModal + labaNet;
  const totPasiva = totLiab + totEkuitas;
  const balanced = Math.abs(totAset - totPasiva) < 1;
  const byAkun = jns => {
    const m = {};
    arr.filter(d=>d.jenis===jns).forEach(d=>{m[d.akun]=(m[d.akun]||0)+d.nominal;});
    return Object.entries(m);
  };
  const asetRows = byAkun('aset');
  const liabRows = byAkun('liabilitas');
  const modalRows = byAkun('modal');
  const makeRows = rows => rows.map(([a,v]) => `<tr><td class="mono" style="color:#b4b2a9;font-size:11px">${KODE_AKUN[a]||'-'}</td><td>${a}</td><td style="text-align:right;font-weight:500">${fmt(v)}</td></tr>`).join('');
  const el = document.getElementById('neraca-content');
  el.innerHTML = `
  <div class="page-title">Neraca Keuangan &nbsp;|&nbsp; ${bulan||'Semua Periode'}</div>
  <div class="neraca-grid">
    <div>
      <div class="section-box">
        <div class="section-box-title" style="color:#185fa5">🏦 ASET</div>
        <div style="font-size:11px;color:#b4b2a9;margin-bottom:0.5rem;text-transform:uppercase;letter-spacing:0.04em">Aset Lancar & Tetap</div>
        ${asetRows.length ? `<table><tbody>${makeRows(asetRows)}</tbody></table>` : '<div style="font-size:12px;color:#b4b2a9;padding:0.5rem 0">Belum ada aset tercatat</div>'}
        <div class="section-total" style="margin-top:0.75rem"><span>TOTAL ASET</span><span style="color:#185fa5;font-size:15px">${fmt(totAset)}</span></div>
      </div>
    </div>
    <div>
      <div class="section-box">
        <div class="section-box-title" style="color:#854f0b">💳 LIABILITAS</div>
        ${liabRows.length ? `<table><tbody>${makeRows(liabRows)}</tbody></table>` : '<div style="font-size:12px;color:#b4b2a9;padding:0.5rem 0">Belum ada liabilitas tercatat</div>'}
        <div class="section-total"><span>Total Liabilitas</span><span style="color:#854f0b">${fmt(totLiab)}</span></div>
      </div>
      <div class="section-box">
        <div class="section-box-title" style="color:#534ab7">👤 EKUITAS / MODAL</div>
        ${modalRows.length ? `<table><tbody>${makeRows(modalRows)}</tbody></table>` : ''}
        <table><tbody>
          <tr><td class="mono" style="color:#b4b2a9;font-size:11px">3-099</td><td>Laba / Rugi Berjalan</td><td style="text-align:right;font-weight:500;color:${labaNet>=0?'#3b6d11':'#a32d2d'}">${labaNet<0?'- ':''}${fmt(labaNet)}</td></tr>
        </tbody></table>
        <div class="section-total"><span>Total Ekuitas</span><span style="color:#534ab7">${fmt(totEkuitas)}</span></div>
      </div>
      <div class="section-total" style="background:#1a1a18;color:#fff;margin-top:0"><span>TOTAL LIABILITAS + EKUITAS</span><span style="font-size:15px">${fmt(totPasiva)}</span></div>
      <div class="balance-check ${balanced?'balance-ok':'balance-warn'}" style="margin-top:0.5rem">
        ${balanced ? '✓ Neraca seimbang — Aset = Liabilitas + Ekuitas' : '⚠ Neraca belum seimbang — pastikan semua aset sudah dicatat'}
      </div>
    </div>
  </div>`;
}
function init() {
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('inp-tanggal').value = today;
  onJenisChange();
  loadData();
  renderSummary(); renderRecent(); populateFilters();
}
init();
</script>
